displayName: Legacy mTLS Headers
type: middleware
import: github.com/pvarki/golang-traefik-plugins/plugins/legacy-mtls-headers
summary: Re-publish the verified client certificate as the X-ClientCert-* headers older product backends expect.
testData:
  clientCertDNHeader: X-ClientCert-DN
  clientCertSerialHeader: X-ClientCert-Serial
  clientCertFingerprintHeader: X-SSL-Client-Fingerprint
