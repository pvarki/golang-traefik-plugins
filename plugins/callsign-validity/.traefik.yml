displayName: Callsign Validity
type: middleware
runtime: wasm
summary: Authorize mTLS requests by asking the rasenmaeher-api OCSP responder whether the client certificate is still good. Revoked and unknown both deny.
testData:
  ocspURL: http://rmapi.opendefence-system.svc.cluster.local:8000/api/v1/ocsp
  caBundlePath: /ca/ca.pem
  dnsServer: 10.43.0.10:53
  certHeader: X-Forwarded-Tls-Client-Cert
  callsignHeader: Callsign
  validityHeader: Callsign-Valid
  requestTimeoutSeconds: 3
