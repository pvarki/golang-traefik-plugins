version: "3"

vars:
  DIST: dist
  IMAGE: ghcr.io/pvarki/golang-traefik-plugins
  TAG:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  PLUGINS:
    sh: find plugins -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run the Go tests natively
    cmds:
      - go test ./... {{.CLI_ARGS}}

  build:
    desc: Build every plugin as a wasm module into dist/
    cmds:
      - rm -rf {{.DIST}}
      - for: { var: PLUGINS }
        cmd: |
          mkdir -p "{{.DIST}}/{{.ITEM}}"
          GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build \
            -buildmode=c-shared -trimpath \
            -o "{{.DIST}}/{{.ITEM}}/plugin.wasm" "./plugins/{{.ITEM}}"
          cp "plugins/{{.ITEM}}/.traefik.yml" "{{.DIST}}/{{.ITEM}}/"

  verify:
    desc: Check each built module loads in wazero and exports the http-wasm entry points
    deps: [build]
    cmds:
      - go run ./tools/wasmverify {{.DIST}}/*/plugin.wasm

  image:
    desc: Build the plugin image locally
    cmds:
      - docker build -t {{.IMAGE}}:{{.TAG}} .
      - echo "built {{.IMAGE}}:{{.TAG}}"

  lint:
    desc: Run the pre-commit hooks against all files
    cmds:
      - prek run --all-files

  tidy:
    desc: Tidy dependencies
    cmds:
      - go mod tidy

  ci:
    desc: What CI runs
    cmds:
      - task: test
      - task: verify
